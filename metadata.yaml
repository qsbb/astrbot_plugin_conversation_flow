name: astrbot_plugin_conversation_flow
display_name: 凝心溯溪-言
short_desc: 凝心溯溪系列对话模块：自然停顿、分段、衔接与群聊判断
desc: >
  凝心溯溪系列对话模块：让 AstrBot 更自然地判断何时回应、如何分段、怎样衔接上下文，
  并处理群聊参与、短期跨会话连续性、图片意图和服务式追问收尾。
version: 0.8.4
author: 凌溪
author_desc: >
  凝心溯溪系列插件作者，关注自然对话、长期关系与可控的智能体协作。
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
repo: "https://github.com/qsbb/astrbot_plugin_conversation_flow"
homepage: "https://github.com/qsbb/astrbot_plugin_conversation_flow"
tags:
  - conversation
  - silence
  - chunking
  - interrupt
  - natural-reply
  - flow-control
  - scene-awareness
license: "MIT"
disclaimer: >
  本插件通过指令注入与会话状态管理改变 bot 的回复节奏与时机，不改变 LLM 本身的能力。
  沉默/拒绝回应的判断由模型依据 prompt 自主完成，开发者不对模型具体判断结果承担责任。
  请合理配置 prompt，避免误伤正常对话或被恶意利用。
