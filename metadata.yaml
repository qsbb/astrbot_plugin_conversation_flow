name: astrbot_plugin_conversation_flow
display_name: 凝心溯溪-言
short_desc: 凝心溯溪系列对话模块：沉默判断、拟人化情绪、智能分段、插话衔接与群聊场景感知
desc: >
  让 AstrBot 的回复节奏更接近真人聊天。通过提示词注入和结果装饰两阶段控制对话流，不改变 LLM 本身能力。

  核心能力：

  1) 沉默/拒绝回应判断：对"好的""嗯""hhhh"等无意义消息、骚扰攻击、话题终结符保持沉默，避免 bot 强行回复收不住话题。

  2) 智能分段回复：向 LLM 注入分段引导指令，让模型主动用双空行分段；结果装饰阶段按双空行优先 + 句末标点（。！？!?）保底切分，模拟真人分段发送节奏。代码块不被切分。

  3) 插话中断处理：bot 还在思考时用户追加消息，旧回复会被抑制或合并到新请求；支持群聊中断作用域（room/sender/mention_or_sender）和时间窗过滤。实验性开关可在思考期间抑制旧结果并合并重新生成（注意 Token 消耗）。

  4) 群聊上下文注入：bot 在群聊中被@或回复时，自动获取最近若干条群聊消息作为背景上下文注入 LLM 请求，帮助理解群聊氛围；同一用户先发纯文本、随后单独 @Bot 时，可在短时间窗内把前一条正文恢复为当前问题。上下文会同时记录 bot 自己的发言并单独标注，配合 OneBot v11 的 message_id 还原"谁在回复谁"，用户引用某条消息时会明确告知 LLM 被引用内容的归属，避免把 bot 自己说过的话当成用户观点复述。

  5) 智能拦截：向主 LLM 注入拦截指令，让模型在主对话思维链中一并判断不良内容（色情/暴力/辱骂/违法/越狱等），命中则礼貌拒绝或静默。

  6) 纯文本模式：向 LLM 注入指令要求纯文本回复（不用 Markdown 格式），并在发送前剥离残留标记，代码块不受影响。

  7) 图片意图判断：兼容主模型直接看图和 AstrBot 图片描述结果，在同一次主模型请求中分别判断媒体形态与对话作用；表情包不默认等于结束，头像必须有上下文依据，只有任务完成、无待处理内容且明确告别时才允许沉默收口。

  8) 群聊读空气：用滑动窗口统计 bot 在本群的回复频次与礼貌收尾话术次数，命中上限时静默本轮，压住多 bot 互相引用刷屏与"晚安—晚安—拜拜"这类没有信息量的收尾循环。判定基于本地计数，不调用 LLM，被拦下的这轮不消耗 Token。

  9) 群聊场景感知：基于 @ 段、引用段与最近发言者昵称，判断当前这句话是对 bot 说、对群里另一个人说、还是对整个群说。判定为在对别人说话时默认注入软指令要求不要接话，避免两个群友正在对话时 bot 插进去打断；同时保证"既 @ bot 又 @ 别人"的消息仍算对 bot 说，不会该回的没回。规则判定，不调用 LLM。

  10) 自然工具调用：普通对话不主动暴露工具名/函数名/接口名，也不把权限报错原文念给用户；用户明确询问插件或开发实现时允许回答实际可见信息。仅约束表达方式，不改变工具是否被调用。

  11) 拟人化情绪：按群聊互动频率、复读和连续对话轮数动态调整回复意愿；懒散时回复更短，烦躁时即使被 @ 也可自行沉默，并保护命令、求助消息与连续静默上限。

  12) 私聊上下文承接：在内存中保留少量已实际交付的最近轮次；遇到简称、纠正或“试试能不能用”这类省略式短消息时，重新绑定上一轮对象与任务，避免分段主动发送后丢失指代。

  13) 服务式追问收尾抑制：识别“还需要我帮你……吗”“有需要随时告诉我”等客服式收尾，按会话用户统计连续次数并分档约束；只记录通过静默、插话和结果装饰检查后的最终文本。
