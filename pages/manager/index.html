<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>凝心溯溪-言 · 对话流状态</title>
    <link rel="stylesheet" href="./style.css?v=0.12.2-1" />
        <link rel="stylesheet" href="./series-ui.css?v=0.12.2-1" />
  </head>
  <body data-series-ui="1">
    <p id="bridge-error" class="alert error" role="alert" hidden>
      页面通信组件没有加载，请从 AstrBot 插件详情重新打开本页。
    </p>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">AstrBot 插件管理页</p>
          <h1>凝心溯溪-言</h1>
          <p>沉默判断、智能分段、插话引导与群聊上下文状态</p>
          <p id="plugin-meta" class="meta-line">版本读取中</p>
        </div>
        <button id="refresh" type="button">刷新</button>
      </header>
      <p id="stale-notice" class="alert warning" role="status" hidden></p>
      <section id="stats" class="stat-groups" aria-label="运行统计"></section>
      <section class="card">
        <h2>能力状态</h2>
        <div id="features" class="feature-list"></div>
      </section>
      <section class="card">
        <h2>当前配置摘要</h2>
        <div id="config-summary" class="feature-list"><p class="empty-state">读取中…</p></div>
      </section>
      <p class="note">配置修改请在 AstrBot 插件配置中进行；核安装后可在核 WebUI 统一查看本面板。</p>
    </main>
    <script src="/api/plugin/page/bridge-sdk.js"></script>
    <script src="./series-ui.js?v=0.12.2-1"></script>
    <script type="module" src="./app.js?v=0.12.2-1"></script>
  </body>
</html>
